name: Site Governance

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: "Expected Vercel deployment commit SHA"
        required: false
        type: string
  repository_dispatch:
    types: [vercel-deployment-ready]
  deployment_status:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "governance/**"
      - "scripts/**"
      - "docs/governance/**"
      - "package.json"
      - "package-lock.json"
      - "astro.config.mjs"
  pull_request:
    paths:
      - "src/**"
      - "public/**"
      - "governance/**"
      - "scripts/**"
      - "docs/governance/**"
      - "package.json"
      - "package-lock.json"
      - "astro.config.mjs"

permissions:
  contents: read

concurrency:
  group: site-governance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Build and audit the Research Ledger
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve publication impact plan
        run: npm run publication:plan > /tmp/site-publication-plan.json

      - name: Classify changed surfaces
        run: npm run audit:impact > /tmp/site-change-impact.json

      - name: Verify deterministic publication synchronization
        run: |
          npm run publication:sync
          git diff --exit-code -- public/generated/publication-manifest.json public/generated/publication-impact.json public/generated/media-manifest.json public/llms.txt public/entity/jearonwong-mplp-gaic-entity-graph.json public/social public/figures

      - name: Run governed closeout
        run: npm run audit:all

      - name: Verify public media visual system
        run: npm run assets:media:check

      - name: Start static preview for route matrix
        run: |
          npm run preview -- --host 127.0.0.1 --port 4321 > /tmp/site-preview.log 2>&1 &
          PREVIEW_PID=$!
          echo "$PREVIEW_PID" > /tmp/site-preview.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4321/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/site-preview.log
          exit 1

      - name: Verify rendered route matrix
        run: npm run audit:routes -- --base http://127.0.0.1:4321

      - name: Stop static preview
        if: always()
        run: if test -f /tmp/site-preview.pid; then kill "$(cat /tmp/site-preview.pid)" || true; fi

      - name: Write publication receipt
        run: npm run publication:closeout

      - name: Upload publication evidence
        uses: actions/upload-artifact@v4
        with:
          name: site-publication-evidence
          path: |
            /tmp/site-publication-plan.json
            /tmp/site-change-impact.json
            /tmp/site-preview.log
            dist/publication-receipt.json
          if-no-files-found: error

  production-verify:
    name: Verify Vercel production deployment
    if: >-
      ${{
        (github.event_name == 'workflow_dispatch' && vars.SITE_BASE_URL != '') ||
        (github.event_name == 'repository_dispatch' && github.event.client_payload.url != '') ||
        (github.event_name == 'deployment_status' && github.event.deployment_status.state == 'success' &&
          (github.event.deployment_status.environment_url != '' || github.event.deployment_status.target_url != ''))
      }}
    needs: audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify deployed routes and commit
        env:
          SITE_BASE_URL: ${{ github.event.client_payload.url || github.event.deployment_status.environment_url || github.event.deployment_status.target_url || vars.SITE_BASE_URL }}
          EXPECTED_DEPLOY_COMMIT: ${{ github.event.client_payload.commit || github.event.deployment.sha || inputs.expected_commit || github.sha }}
          VERCEL_API_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: npm run verify:production

      - name: Upload production receipt
        uses: actions/upload-artifact@v4
        with:
          name: site-production-receipt
          path: dist/production-receipt.json
          if-no-files-found: error
