name: Site Governance

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: "Expected Vercel deployment commit SHA"
        required: false
        type: string
  repository_dispatch:
    types: [vercel-deployment-ready]
  deployment_status:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "governance/**"
      - "scripts/**"
      - "docs/governance/**"
      - "design/**"
      - ".agents/skills/**"
      - ".codex/skills/**"
      - "AGENTS.md"
      - "README.md"
      - "package.json"
      - "package-lock.json"
      - "astro.config.mjs"
      - "vercel.json"
  pull_request:
    paths:
      - "src/**"
      - "public/**"
      - "governance/**"
      - "scripts/**"
      - "docs/governance/**"
      - "design/**"
      - ".agents/skills/**"
      - ".codex/skills/**"
      - "AGENTS.md"
      - "README.md"
      - "package.json"
      - "package-lock.json"
      - "astro.config.mjs"
      - "vercel.json"

permissions:
  contents: read

concurrency:
  group: site-governance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Build and audit the Research Ledger
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for dynamic browser checks
        run: npx playwright install --no-shell chromium

      - name: Run the single governed publication entrypoint
        env:
          PUBLICATION_EVIDENCE_DIR: /tmp
          PUBLICATION_PREVIEW_PORT: 4321
        run: npm run publication:release -- --ci

      - name: Upload publication evidence
        uses: actions/upload-artifact@v4
        with:
          name: site-publication-evidence
          path: |
            /tmp/site-publication-plan.json
            /tmp/site-change-impact.json
            /tmp/site-preview.log
            dist/publication-receipt.json
            dist/browser-quality/**
          if-no-files-found: error

  production-verify:
    name: Verify Vercel production deployment
    if: >-
      ${{
        (github.event_name == 'workflow_dispatch' && vars.SITE_BASE_URL != '') ||
        (github.event_name == 'repository_dispatch' && github.event.client_payload.url != '') ||
        (github.event_name == 'deployment_status' && github.event.deployment_status.state == 'success' &&
          (github.event.deployment_status.environment_url != '' || github.event.deployment_status.target_url != ''))
      }}
    needs: audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify deployed routes and commit
        env:
          SITE_BASE_URL: ${{ github.event.client_payload.url || github.event.deployment_status.environment_url || github.event.deployment_status.target_url || vars.SITE_BASE_URL }}
          EXPECTED_DEPLOY_COMMIT: ${{ github.event.client_payload.commit || github.event.deployment.sha || inputs.expected_commit || github.sha }}
          VERCEL_API_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: npm run verify:production

      - name: Upload production receipt
        uses: actions/upload-artifact@v4
        with:
          name: site-production-receipt
          path: dist/production-receipt.json
          if-no-files-found: error
