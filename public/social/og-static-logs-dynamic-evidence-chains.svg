<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">The Auditability Era of Agentic AI</title>
  <desc id="desc">Open graph image for the essay From Static Logs to Dynamic Evidence Chains: The Auditability Era of Agentic AI by Jearon Wong.</desc>
  <defs>
    <style>
      .bg{fill:#111111}
      .grid-line{stroke:rgba(241,245,249,0.055);stroke-width:1}
      .frame{fill:none;stroke:rgba(241,245,249,0.13);stroke-width:1.1}
      .frame-blue{fill:none;stroke:rgba(59,130,246,0.35);stroke-width:1.1}
      .panel{fill:rgba(255,255,255,0.025);stroke:rgba(241,245,249,0.14);stroke-width:1.1}
      .panel-hot{fill:rgba(34,211,238,0.06);stroke:rgba(34,211,238,0.42);stroke-width:1.4}
      .label{fill:#22d3ee;font-family:"JetBrains Mono",Menlo,monospace;font-size:16px;font-weight:800;letter-spacing:1px}
      .label-muted{fill:#94a3b8;font-family:"JetBrains Mono",Menlo,monospace;font-size:13px;font-weight:800;letter-spacing:.75px}
      .title-framing{fill:rgba(241,245,249,0.82);font-family:"Outfit",Inter,sans-serif;font-size:34px;font-weight:700;letter-spacing:0}
      .title-main{fill:#f8fafc;font-family:"Outfit",Inter,sans-serif;font-size:66px;font-weight:760;letter-spacing:-.5px}
      .subtitle{fill:#cbd5e1;font-family:Inter,sans-serif;font-size:25px;font-weight:560}
      .mono{fill:#e2e8f0;font-family:"JetBrains Mono",Menlo,monospace;font-size:15px;font-weight:800;letter-spacing:.35px}
      .small{fill:#94a3b8;font-family:Inter,sans-serif;font-size:17px;font-weight:520}
      .line{stroke:rgba(34,211,238,0.78);stroke-width:2.4;fill:none;marker-end:url(#arrow)}
    </style>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0L0 0 0 40" fill="none" class="grid-line"/>
    </pattern>
    <marker id="arrow" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto">
      <path d="M0,0 L12,4.5 L0,9 Z" fill="#22d3ee"/>
    </marker>
  </defs>

  <rect width="1200" height="630" class="bg"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect x="48" y="48" width="1104" height="534" class="frame"/>
  <rect x="72" y="72" width="1056" height="486" class="frame-blue"/>

  <text x="96" y="122" class="label">AGENTIC LIFECYCLE GOVERNANCE / AIAAWP-2026-v0.1</text>
  <text x="96" y="204" class="title-framing">From Static Logs to Dynamic Evidence Chains:</text>
  <text x="96" y="300" class="title-main">The Auditability Era</text>
  <text x="96" y="374" class="title-main">of Agentic AI</text>
  <text x="96" y="434" class="subtitle">Static logs cannot audit dynamic agents.</text>
  <text x="96" y="472" class="subtitle">Evidence chains reconstruct responsibility.</text>

  <g transform="translate(836 146)">
    <rect width="276" height="88" rx="2" class="panel"/>
    <text x="24" y="35" class="label-muted">STATIC LOGS</text>
    <text x="24" y="66" class="small">Activity happened</text>
    <path d="M138 116V248" class="line"/>
    <rect y="278" width="276" height="146" rx="2" class="panel-hot"/>
    <text x="24" y="316" class="label">DYNAMIC EVIDENCE CHAIN</text>
    <text x="24" y="352" class="mono">Authority</text>
    <text x="24" y="378" class="mono">Role · Tool · Outcome</text>
    <text x="24" y="404" class="mono">Exception · Closure</text>
  </g>

  <text x="96" y="532" class="label-muted">JEARON WONG / PROTOCOL ARCHITECT FOR THE AGENT ERA</text>
</svg>
