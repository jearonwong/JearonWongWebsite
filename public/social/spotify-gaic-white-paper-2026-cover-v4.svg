<svg width="3000" height="3000" viewBox="0 0 3000 3000" fill="none" xmlns="http://www.w3.org/2000/svg" aria-labelledby="title desc" data-visual-system="research-ledger-b" data-media-category="publication-artwork" data-palette="neutral-structure-semantic-exceptions">
  <desc id="desc">Spotify Gaic White Paper 2026 Cover V4 visual asset from the Jearon Wong Research Ledger.</desc>
  <title id="title">Spotify Gaic White Paper 2026 Cover V4</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="3000" y2="3000" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#090D12"/>
      <stop offset="0.5" stop-color="#0D131A"/>
      <stop offset="1" stop-color="#111823"/>
    </linearGradient>
    <radialGradient id="mistLeft" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(700 760) rotate(35) scale(980 980)">
      <stop offset="0" stop-color="#18212D" stop-opacity="0.72"/>
      <stop offset="0.6" stop-color="#18212D" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#18212D" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mistRight" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(2520 1680) rotate(45) scale(1060 1060)">
      <stop offset="0" stop-color="#18212D" stop-opacity="0.72"/>
      <stop offset="0.6" stop-color="#18212D" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#18212D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ringStroke" x1="1760" y1="900" x2="2940" y2="2380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2FD9FF"/>
      <stop offset="0.42" stop-color="#8CF26A"/>
      <stop offset="0.72" stop-color="#F8BE57"/>
      <stop offset="1" stop-color="#FF7B5C"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="grain" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="1" seed="7" result="noise"/>
      <feColorMatrix in="noise" type="matrix" values="
        0 0 0 0 0.55
        0 0 0 0 0.60
        0 0 0 0 0.68
        0 0 0 0.06 0" />
    </filter>
  </defs>

  <rect width="3000" height="3000" fill="url(#bg)"/>
  <rect width="3000" height="3000" fill="url(#mistLeft)"/>
  <rect width="3000" height="3000" fill="url(#mistRight)"/>
  <rect width="3000" height="3000" filter="url(#grain)" opacity="0.16"/>

  <g transform="translate(2245 1640)" filter="url(#softGlow)">
    <circle cx="0" cy="0" r="650" fill="none" stroke="#243244" stroke-width="34" opacity="0.24"/>
    <circle cx="0" cy="0" r="650" fill="none" stroke="url(#ringStroke)" stroke-width="34" stroke-linecap="round" stroke-dasharray="720 2440" opacity="0.95"/>
    <circle cx="0" cy="0" r="650" fill="none" stroke="#2A3648" stroke-width="26" stroke-dasharray="92 60" opacity="0.22"/>
    <circle cx="0" cy="-650" r="22" fill="#2FD9FF" opacity="0.9"/>
    <circle cx="650" cy="0" r="22" fill="#8CF26A" opacity="0.9"/>
    <circle cx="0" cy="650" r="22" fill="#FF7B5C" opacity="0.9"/>
    <circle cx="-650" cy="0" r="22" fill="#F8BE57" opacity="0.9"/>
    <rect x="-128" y="-128" width="256" height="256" rx="28" fill="#0B1118" stroke="#EAF3FA" stroke-width="8" opacity="0.94"/>
    <path d="M-84 -52H84" stroke="#2FD9FF" stroke-width="12" stroke-linecap="round"/>
    <path d="M-84 0H84" stroke="#EAF3FA" stroke-width="12" stroke-linecap="round"/>
    <path d="M-84 52H84" stroke="#FF7B5C" stroke-width="12" stroke-linecap="round"/>
  </g>

  <g font-family="Inter, Helvetica, sans-serif" font-weight="900">
    <text x="180" y="620" fill="#30D8FF" font-size="180">GLOBAL AI</text>
    <text x="180" y="1040" fill="#F5FAFF" font-size="380">COMPLIANCE</text>
    <text x="180" y="1430" fill="#FF7B5C" font-size="220">WHITE PAPER</text>
    <text x="180" y="1845" fill="#8CF26A" font-size="300">2026</text>
  </g>

  <path d="M180 1944H990" stroke="#F8BE57" stroke-width="10" opacity="0.72"/>
  <text x="180" y="2148" fill="#B8C7D8" font-family="Inter, Helvetica, sans-serif" font-size="54" font-weight="700">Agentic lifecycle conformance</text>

  <text x="180" y="2824" fill="#F5FAFF" font-family="Inter, Helvetica, sans-serif" font-size="44" font-weight="800">JEARON WONG</text>
  <text x="180" y="2878" fill="#93A8BC" font-family="Inter, Helvetica, sans-serif" font-size="28" font-weight="700">PROTOCOL DESIGN FOR THE AGENT ERA</text>
</svg>
