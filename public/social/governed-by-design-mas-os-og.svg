<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Governed by Design: The Protocol-Native MAS OS</title>
  <desc id="desc">Open graph image for the Jearon Wong essay Governed by Design: The Protocol-Native Multi-Agent Operating System for the Next Era of AI.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0L0 0 0 40" fill="none" stroke="#f1f5f9" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
    <style>
      .label{fill:#22d3ee;font-family:"JetBrains Mono",Menlo,monospace;font-size:16px;font-weight:800;letter-spacing:1.1px}
      .label-muted{fill:#94a3b8;font-family:"JetBrains Mono",Menlo,monospace;font-size:13px;font-weight:800;letter-spacing:.8px}
      .title-kicker{fill:#e2e8f0;font-family:"Outfit",Inter,sans-serif;font-size:38px;font-weight:720;letter-spacing:0}
      .title-main{fill:#f8fafc;font-family:"Outfit",Inter,sans-serif;font-size:54px;font-weight:780;letter-spacing:0}
      .title-tail{fill:#f8fafc;font-family:"Outfit",Inter,sans-serif;font-size:50px;font-weight:760;letter-spacing:0}
      .copy{fill:#cbd5e1;font-family:Inter,sans-serif;font-size:21px;font-weight:560}
      .mono{fill:#e2e8f0;font-family:"JetBrains Mono",Menlo,monospace;font-size:14px;font-weight:800;letter-spacing:.25px}
      .panel{fill:rgba(255,255,255,.035);stroke:rgba(241,245,249,.14);stroke-width:1.1}
      .panel-hot{fill:rgba(34,211,238,.075);stroke:rgba(34,211,238,.48);stroke-width:1.35}
      .line{stroke:#22d3ee;stroke-opacity:.7;stroke-width:2}
    </style>
  </defs>

  <rect width="1200" height="630" fill="#111111"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect x="48" y="48" width="1104" height="534" fill="none" stroke="#f1f5f9" stroke-opacity=".14" stroke-width="1.2"/>
  <rect x="72" y="72" width="1056" height="486" fill="none" stroke="#3b82f6" stroke-opacity=".35" stroke-width="1"/>

  <text x="96" y="122" class="label">MPLP / PROTOCOL-NATIVE MAS OS</text>
  <text x="96" y="192" class="title-kicker">Governed by Design:</text>
  <text x="96" y="262" class="title-main">The Protocol-Native</text>
  <text x="96" y="320" class="title-main">Multi-Agent</text>
  <text x="96" y="378" class="title-main">Operating System</text>
  <text x="96" y="434" class="title-tail">for the Next Era of AI</text>
  <text x="96" y="472" class="copy">Intent · Drift · HITL · Evidence · Handoff · Outcome</text>

  <g transform="translate(790 134)">
    <rect width="280" height="68" rx="2" class="panel"/>
    <text x="24" y="42" class="mono">FOUNDATION MODELS</text>
    <line x1="140" y1="78" x2="140" y2="114" class="line"/>
    <rect y="124" width="280" height="112" rx="2" class="panel-hot"/>
    <text x="24" y="164" class="label">MPLP PROTOCOL LAYER</text>
    <text x="24" y="196" class="mono">lifecycle semantics</text>
    <line x1="140" y1="246" x2="140" y2="282" class="line"/>
    <rect y="292" width="280" height="74" rx="2" class="panel"/>
    <text x="24" y="336" class="mono">COGNITIVE OS RUNTIME</text>
  </g>

  <g transform="translate(96 504)">
    <rect width="620" height="50" rx="2" fill="rgba(34,211,238,.075)" stroke="#22d3ee" stroke-opacity=".48" stroke-width="1.3"/>
    <text x="24" y="32" class="mono">TCP/IP · SWIFT · HTTP: architectural analogy, not adoption claim</text>
  </g>

  <text x="96" y="572" class="label-muted">JEARON WONG / PROTOCOL ARCHITECT FOR THE AGENT ERA</text>
</svg>
