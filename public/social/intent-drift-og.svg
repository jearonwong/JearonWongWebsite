<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Defining Intent Drift in Agentic Workflows</title>
  <desc id="desc">Open graph image for Jearon Wong essay on Intent Drift, Delta Intent, and Drift Detection.</desc>
  <defs>
    <style>
      .bg{fill:#111111}
      .grid-line{stroke:rgba(241,245,249,0.055);stroke-width:1}
      .frame{fill:none;stroke:rgba(241,245,249,0.14);stroke-width:1.2}
      .panel{fill:rgba(255,255,255,0.035);stroke:rgba(241,245,249,0.16);stroke-width:1.2}
      .panel-hot{fill:rgba(34,211,238,0.065);stroke:rgba(34,211,238,0.48);stroke-width:1.4}
      .label{fill:#22d3ee;font:700 17px "JetBrains Mono",Menlo,monospace;letter-spacing:1.35px}
      .muted{fill:#94a3b8;font:700 13px "JetBrains Mono",Menlo,monospace;letter-spacing:1px}
      .title{fill:#f8fafc;font:820 58px "Outfit",Inter,sans-serif}
      .subtitle{fill:#cbd5e1;font:600 25px Inter,sans-serif}
      .hot{fill:#22d3ee}
      .mono{fill:#e2e8f0;font:700 17px "JetBrains Mono",Menlo,monospace;letter-spacing:.6px}
      .small{fill:#94a3b8;font:560 17px Inter,sans-serif}
    </style>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0L0 0 0 40" fill="none" class="grid-line"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" class="bg"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect x="48" y="48" width="1104" height="534" class="frame"/>
  <rect x="72" y="72" width="1056" height="486" fill="none" stroke="rgba(59,130,246,0.35)" stroke-width="1"/>

  <text x="96" y="122" class="label">DEFINE THE AI AGENT LIFECYCLE / INTENT DRIFT</text>
  <text x="96" y="214" class="title">Defining</text>
  <text x="96" y="282" class="title">Intent Drift</text>
  <text x="96" y="350" class="subtitle">Execution can succeed while <tspan class="hot">intent fails.</tspan></text>
  <text x="96" y="392" class="subtitle">Delta Intent records the change.</text>
  <text x="96" y="430" class="subtitle">Drift Detection observes divergence.</text>

  <g transform="translate(770 166)">
    <rect width="300" height="82" rx="2" class="panel-hot"/>
    <text x="24" y="35" class="muted">FAILURE</text>
    <text x="24" y="62" class="mono">Intent Drift</text>
    <rect y="116" width="300" height="82" rx="2" class="panel"/>
    <text x="24" y="151" class="muted">COMPARISON</text>
    <text x="24" y="178" class="mono">Delta Intent</text>
    <rect y="232" width="300" height="82" rx="2" class="panel"/>
    <text x="24" y="267" class="muted">RUNTIME SIGNAL</text>
    <text x="24" y="294" class="mono">Drift Detection</text>
  </g>

  <text x="96" y="532" class="muted">JEARON WONG / PROTOCOL ARCHITECT FOR THE AGENT ERA</text>
</svg>
