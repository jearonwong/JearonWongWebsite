<svg width="1200" height="1600" viewBox="0 0 1200 1600" fill="none" xmlns="http://www.w3.org/2000/svg" aria-labelledby="title desc" data-visual-system="research-ledger-b" data-media-category="publication-artwork" data-palette="neutral-structure-semantic-exceptions">
  <desc id="desc">Agentic Lifecycle Governance Poster visual asset from the Jearon Wong Research Ledger.</desc>
  <title id="title">Agentic Lifecycle Governance Poster</title>
  <rect width="1200" height="1600" fill="#f7f8fa"/>
  <rect x="70" y="66" width="1060" height="1468" fill="#f7f8fa" stroke="#1A1917" stroke-width="2"/>

  <text x="110" y="126" fill="#B84B18" font-family="JetBrains Mono, Menlo, monospace" font-size="20" font-weight="500" letter-spacing="3">CONCEPT CORE · AI GOVERNANCE</text>
  <line x1="110" y1="164" x2="1090" y2="164" stroke="#1A1917" stroke-width="2"/>

  <text x="110" y="242" fill="#1A1917" font-family="Outfit, 'Outfit', serif" font-size="70" font-weight="400">Agentic Lifecycle</text>
  <text x="110" y="318" fill="#1A1917" font-family="Outfit, 'Outfit', serif" font-size="70" font-weight="400">Governance</text>
  <text x="110" y="388" fill="#B84B18" font-family="Outfit, 'Outfit', serif" font-size="50" font-style="italic" font-weight="400">Why AI agent compliance requires</text>
  <text x="110" y="444" fill="#B84B18" font-family="Outfit, 'Outfit', serif" font-size="50" font-style="italic" font-weight="400">lifecycle responsibility objects</text>

  <text x="110" y="516" fill="#3D3C39" font-family="Inter, Inter, sans-serif" font-size="27" font-weight="300">When AI systems act through agents, tools, handoffs, and memory,</text>
  <text x="110" y="557" fill="#3D3C39" font-family="Inter, Inter, sans-serif" font-size="27" font-weight="300">the compliance unit shifts from model output to delegated work.</text>

  <rect x="110" y="620" width="980" height="178" rx="4" fill="#1A1917"/>
  <text x="146" y="674" fill="#9C9A93" font-family="JetBrains Mono, Menlo, monospace" font-size="17" font-weight="500" letter-spacing="2">CATEGORY DEFINITION</text>
  <text x="146" y="730" fill="#f7f8fa" font-family="Outfit, 'Outfit', serif" font-size="39" font-weight="400">AI agent compliance is</text>
  <text x="146" y="781" fill="#F0A07A" font-family="Outfit, 'Outfit', serif" font-size="39" font-style="italic" font-weight="400">lifecycle responsibility compliance.</text>

  <text x="110" y="872" fill="#9C9A93" font-family="JetBrains Mono, Menlo, monospace" font-size="17" font-weight="500" letter-spacing="2">THE COMPLIANCE UNIT SHIFT</text>
  <line x1="430" y1="866" x2="1090" y2="866" stroke="#E4E2DA" stroke-width="2"/>

  <rect x="110" y="910" width="455" height="238" rx="4" fill="#f7f8fa" stroke="#CAC8BE" stroke-width="2"/>
  <text x="144" y="964" fill="#6B6A65" font-family="JetBrains Mono, Menlo, monospace" font-size="18" font-weight="500" letter-spacing="2">OLD UNIT</text>
  <text x="144" y="1028" fill="#1A1917" font-family="Outfit, 'Outfit', serif" font-size="42" font-weight="400">Model Output</text>
  <text x="144" y="1090" fill="#6B6A65" font-family="Inter, Inter, sans-serif" font-size="25" font-weight="300">Safety, accuracy, policies,</text>
  <text x="144" y="1128" fill="#6B6A65" font-family="Inter, Inter, sans-serif" font-size="25" font-weight="300">dashboards, monitoring.</text>

  <path d="M596 1029H688" stroke="#9C9A93" stroke-width="5"/>
  <path d="M688 1029L660 1007V1051L688 1029Z" fill="#9C9A93"/>

  <rect x="720" y="910" width="370" height="250" rx="4" fill="#edf1f4" stroke="#0D6650" stroke-width="2"/>
  <text x="754" y="964" fill="#0D6650" font-family="JetBrains Mono, Menlo, monospace" font-size="18" font-weight="500" letter-spacing="2">NEW UNIT</text>
  <text x="754" y="1028" fill="#094F3C" font-family="Outfit, 'Outfit', serif" font-size="42" font-weight="400">Lifecycle of</text>
  <text x="754" y="1078" fill="#094F3C" font-family="Outfit, 'Outfit', serif" font-size="42" font-weight="400">Delegated Work</text>
  <text x="754" y="1140" fill="#3D3C39" font-family="Inter, Inter, sans-serif" font-size="22" font-weight="300">Authority · Evidence · Closure</text>

