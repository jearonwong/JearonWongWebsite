  <line x1="110" y1="1482" x2="1090" y2="1482" stroke="#CAC8BE" stroke-width="1.5"/>
  <text x="110" y="1520" fill="#0D6650" font-family="JetBrains Mono, Menlo, monospace" font-size="18" font-weight="500">Global AI Compliance White Paper 2026</text>
  <text x="1090" y="1520" fill="#6B6A65" font-family="JetBrains Mono, Menlo, monospace" font-size="18" font-weight="500" text-anchor="end">Jearon Wong · May 2026</text>
