    <text x="812" y="1297" fill="#93560A" font-size="17" font-family="JetBrains Mono, Menlo, monospace">MRO-04</text>
    <text x="812" y="1330" fill="#1A1917" font-size="25" font-weight="500">Accepted Outcome</text>

    <rect x="280" y="1372" width="300" height="82" rx="4" fill="#f0f2f5" stroke="#4E43A8" stroke-width="1.5"/>
    <text x="302" y="1405" fill="#4E43A8" font-size="17" font-family="JetBrains Mono, Menlo, monospace">MRO-08</text>
