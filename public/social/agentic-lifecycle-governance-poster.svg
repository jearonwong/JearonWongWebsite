    <text x="642" y="1405" fill="#8C3610" font-size="17" font-family="JetBrains Mono, Menlo, monospace">MRO-16</text>
    <text x="642" y="1438" fill="#1A1917" font-size="25" font-weight="500">Remediation Closure</text>
