<svg width="3000" height="3000" viewBox="0 0 3000 3000" fill="none" xmlns="http://www.w3.org/2000/svg" aria-labelledby="title desc" data-visual-system="research-ledger-b" data-media-category="publication-artwork" data-palette="neutral-structure-semantic-exceptions">
  <desc id="desc">Spotify Gaic White Paper 2026 Cover V3 visual asset from the Jearon Wong Research Ledger.</desc>
  <title id="title">Spotify Gaic White Paper 2026 Cover V3</title>
  <defs>
