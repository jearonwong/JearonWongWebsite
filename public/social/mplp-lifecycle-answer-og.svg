<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">MPLP Defines the Lifecycle Answer</title>
  <desc id="desc">Open graph image for the Jearon Wong essay on MPLP as the lifecycle answer for AI Agent Governance.</desc>
  <defs>
    <style>
      .bg{fill:#111111}
      .grid-line{stroke:rgba(241,245,249,.055);stroke-width:1}
      .frame{fill:none;stroke:rgba(241,245,249,.14);stroke-width:1.2}
      .panel{fill:rgba(255,255,255,.035);stroke:rgba(241,245,249,.16);stroke-width:1.2}
      .panel-hot{fill:rgba(34,211,238,.07);stroke:rgba(34,211,238,.48);stroke-width:1.4}
      .label{fill:#22d3ee;font:800 17px "JetBrains Mono",Menlo,monospace;letter-spacing:1.3px}
      .title{fill:#f8fafc;font:850 58px "Outfit",Inter,sans-serif}
      .subtitle{fill:#cbd5e1;font:650 25px Inter,sans-serif}
      .hot{fill:#22d3ee}
      .mono{fill:#e2e8f0;font:800 17px "JetBrains Mono",Menlo,monospace;letter-spacing:.5px}
      .muted{fill:#94a3b8;font:800 13px "JetBrains Mono",Menlo,monospace;letter-spacing:1px}
      .arrow{fill:#3b82f6;font:800 18px "JetBrains Mono",Menlo,monospace}
    </style>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0L0 0 0 40" fill="none" class="grid-line"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" class="bg"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect x="48" y="48" width="1104" height="534" class="frame"/>
  <rect x="72" y="72" width="1056" height="486" fill="none" stroke="rgba(59,130,246,.35)" stroke-width="1"/>

  <text x="96" y="122" class="label">AI AGENT GOVERNANCE / MPLP</text>
  <text x="96" y="214" class="title">MPLP Defines the</text>
  <text x="96" y="282" class="title">Lifecycle Answer</text>
  <text x="96" y="350" class="subtitle">AI Agent Governance is a <tspan class="hot">lifecycle protocol</tspan> problem.</text>

  <g transform="translate(96 394)">
    <rect width="912" height="112" rx="2" class="panel-hot"/>
    <text x="24" y="33" class="muted">LIFECYCLE CHAIN</text>
    <text x="24" y="62" class="mono">Intent</text>
    <text x="100" y="62" class="arrow">→</text>
    <text x="132" y="62" class="mono">Authority</text>
    <text x="240" y="62" class="arrow">→</text>
    <text x="272" y="62" class="mono">Agent Role</text>
    <text x="402" y="62" class="arrow">→</text>
    <text x="434" y="62" class="mono">Tool Action</text>
    <text x="24" y="94" class="mono">Evidence</text>
    <text x="122" y="94" class="arrow">→</text>
    <text x="154" y="94" class="mono">Accepted Outcome</text>
    <text x="350" y="94" class="arrow">→</text>
    <text x="382" y="94" class="mono">Remediation</text>
  </g>

  <text x="96" y="532" class="muted">JEARON WONG · PROTOCOL ARCHITECT FOR THE AGENT ERA</text>
</svg>
