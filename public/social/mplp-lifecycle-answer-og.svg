<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">The Industry Is Still Debating AI Agent Governance. MPLP Already Defines the Lifecycle Answer.</title>
  <desc id="desc">Open graph image for the Jearon Wong essay The Industry Is Still Debating AI Agent Governance. MPLP Already Defines the Lifecycle Answer.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0L0 0 0 40" fill="none" stroke="#f1f5f9" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="#111111"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect x="48" y="48" width="1104" height="534" fill="none" stroke="#f1f5f9" stroke-opacity=".14" stroke-width="1.2"/>
  <rect x="72" y="72" width="1056" height="486" fill="none" stroke="#3b82f6" stroke-opacity=".35" stroke-width="1"/>

  <text x="96" y="122" fill="#22d3ee" font-family="JetBrains Mono, Menlo, monospace" font-size="17" font-weight="800" letter-spacing="1.3">AI AGENT GOVERNANCE / MPLP</text>
  <text x="96" y="202" fill="#f8fafc" font-family="Outfit, Inter, sans-serif" font-size="50" font-weight="850">The Industry Is Still Debating</text>
  <text x="96" y="260" fill="#f8fafc" font-family="Outfit, Inter, sans-serif" font-size="50" font-weight="850">AI Agent Governance.</text>
  <text x="96" y="318" fill="#f8fafc" font-family="Outfit, Inter, sans-serif" font-size="50" font-weight="850">MPLP Already Defines</text>
  <text x="96" y="376" fill="#f8fafc" font-family="Outfit, Inter, sans-serif" font-size="50" font-weight="850">the Lifecycle Answer.</text>

  <text x="96" y="430" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="23" font-weight="650">AI Agent Governance is a <tspan fill="#22d3ee">lifecycle protocol</tspan> problem.</text>

  <g transform="translate(96 468)">
    <rect width="912" height="54" rx="2" fill="#0d282c" stroke="#22d3ee" stroke-opacity=".48" stroke-width="1.4"/>
    <text x="24" y="34" fill="#e2e8f0" font-family="JetBrains Mono, Menlo, monospace" font-size="15" font-weight="800" letter-spacing=".4">Intent → Authority → Agent Role → Tool Action → Evidence → Accepted Outcome → Remediation</text>
  </g>

  <text x="96" y="552" fill="#94a3b8" font-family="JetBrains Mono, Menlo, monospace" font-size="13" font-weight="800" letter-spacing="1">JEARON WONG · PROTOCOL ARCHITECT FOR THE AGENT ERA</text>
</svg>
