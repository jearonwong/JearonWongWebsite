    <text x="132" y="536" fill="#F8FAFC" font-size="31" font-weight="850">Authority Boundary</text>
    <text x="132" y="568" fill="#9FB1C5" font-size="20" font-weight="600">Who had authority to act?</text>

    <rect x="590" y="450" width="422" height="130" fill="#0D1117" stroke="#86EFAC" stroke-width="2"/>
    <text x="618" y="492" fill="#86EFAC" font-size="22" font-weight="850">MRO-06</text>
    <text x="618" y="536" fill="#F8FAFC" font-size="31" font-weight="850">Responsibility Transfer</text>
    <text x="618" y="568" fill="#9FB1C5" font-size="20" font-weight="600">Where did responsibility move?</text>

    <rect x="1074" y="450" width="422" height="130" fill="#0D1117" stroke="#F59E0B" stroke-width="2"/>
    <text x="1102" y="492" fill="#FBBF24" font-size="22" font-weight="850">MRO-04</text>
    <text x="1102" y="536" fill="#F8FAFC" font-size="31" font-weight="850">Accepted Outcome</text>
    <text x="1102" y="568" fill="#9FB1C5" font-size="20" font-weight="600">Who accepted the final state?</text>

    <rect x="286" y="626" width="422" height="130" fill="#0D1117" stroke="#A78BFA" stroke-width="2"/>
    <text x="314" y="668" fill="#C4B5FD" font-size="22" font-weight="850">MRO-08</text>
    <text x="314" y="712" fill="#F8FAFC" font-size="31" font-weight="850">Evidence Partitioning</text>
    <text x="314" y="744" fill="#9FB1C5" font-size="20" font-weight="600">Which evidence belongs where?</text>

    <rect x="892" y="626" width="422" height="130" fill="#0D1117" stroke="#F472B6" stroke-width="2"/>
