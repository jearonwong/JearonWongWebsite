  <text x="370" y="129" fill="#B8C7D9" font-family="Inter, Inter, sans-serif" font-size="25" font-weight="650">Global AI Compliance White Paper 2026</text>

  <text x="104" y="224" fill="#F8FAFC" font-family="Inter, Inter, sans-serif" font-size="64" font-weight="850">The missing layer is not policy.</text>
  <text x="104" y="294" fill="#F8FAFC" font-family="Inter, Inter, sans-serif" font-size="64" font-weight="850">It is lifecycle responsibility objects.</text>
  <rect x="106" y="328" width="676" height="8" fill="#b8c2ce"/>
  <text x="104" y="384" fill="#C9D7E6" font-family="Inter, Inter, sans-serif" font-size="29" font-weight="600">The paper defines 16 Missing Regulatory Objects. These five create the largest score gaps today.</text>

  <g font-family="Inter, Inter, sans-serif">
    <rect x="104" y="450" width="422" height="130" fill="#0D1117" stroke="#b8c2ce" stroke-width="2"/>
