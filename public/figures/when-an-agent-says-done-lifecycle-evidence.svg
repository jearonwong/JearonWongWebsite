<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">When an Agent Says Done: Execution Run and Accountable Lifecycle</title>
  <desc id="desc">A comparison between a completed execution run and an accountable lifecycle that binds Intent, Authority, Evidence, Accepted Outcome, and Remediation or Reopen.</desc>
  <defs>
    <style>
      .bg { fill: #111111; }
      .grid { stroke: rgba(241,245,249,0.05); stroke-width: 1; }
      .outer { fill: none; stroke: rgba(241,245,249,0.16); stroke-width: 1.2; }
      .panel { fill: rgba(255,255,255,0.026); stroke: rgba(241,245,249,0.16); stroke-width: 1.5; }
      .panel-hot { fill: rgba(34,211,238,0.055); stroke: rgba(34,211,238,0.62); stroke-width: 2; }
      .node { fill: rgba(255,255,255,0.07); stroke: rgba(241,245,249,0.22); stroke-width: 1.2; }
      .node-blue { fill: rgba(59,130,246,0.13); stroke: rgba(59,130,246,0.55); stroke-width: 1.2; }
      .node-cyan { fill: rgba(34,211,238,0.12); stroke: rgba(34,211,238,0.62); stroke-width: 1.2; }
      .kicker { fill: #22d3ee; font: 700 20px "JetBrains Mono", Menlo, monospace; letter-spacing: 1.5px; }
      .label { fill: #64748b; font: 700 17px "JetBrains Mono", Menlo, monospace; letter-spacing: 1.15px; }
      .label-hot { fill: #22d3ee; font: 700 17px "JetBrains Mono", Menlo, monospace; letter-spacing: 1.15px; }
      .title { fill: #f1f5f9; font: 820 54px "Outfit", Inter, sans-serif; letter-spacing: 0; }
      .title-hot { fill: #22d3ee; font: 820 54px "Outfit", Inter, sans-serif; letter-spacing: 0; }
      .panel-title { fill: #f1f5f9; font: 800 32px "Outfit", Inter, sans-serif; }
      .text { fill: #f1f5f9; font: 700 21px Inter, sans-serif; }
      .small { fill: #94a3b8; font: 560 18px Inter, sans-serif; }
      .mono { fill: #f1f5f9; font: 760 19px "JetBrains Mono", Menlo, monospace; letter-spacing: 0.2px; }
      .line { stroke: rgba(148,163,184,0.78); stroke-width: 2.5; fill: none; }
      .line-hot { stroke: rgba(34,211,238,0.92); stroke-width: 2.8; fill: none; }
      .footer { fill: #64748b; font: 700 16px "JetBrains Mono", Menlo, monospace; letter-spacing: 0.8px; }
    </style>
    <pattern id="registry-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" class="grid" fill="none"/>
    </pattern>
    <marker id="arrow" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto">
      <path d="M0,0 L12,4.5 L0,9 Z" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-hot" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto">
      <path d="M0,0 L12,4.5 L0,9 Z" fill="#22d3ee"/>
    </marker>
  </defs>

  <rect width="1600" height="900" class="bg"/>
  <rect width="1600" height="900" fill="url(#registry-grid)"/>
  <rect x="52" y="48" width="1496" height="804" class="outer"/>

  <text x="84" y="104" class="kicker">ARTICLE 01 / LIFECYCLE EVIDENCE</text>
  <text x="84" y="166" class="title">When execution says DONE,</text>
  <text x="84" y="226" class="title-hot">delivery still needs ACCEPTANCE.</text>
  <text x="84" y="266" class="small">A completed run can produce evidence without producing an accepted outcome.</text>

  <g transform="translate(84 326)">
    <rect width="650" height="360" rx="2" class="panel"/>
    <text x="34" y="52" class="label">EXECUTION RUN</text>
    <text x="34" y="96" class="panel-title">A run can finish.</text>
    <text x="34" y="128" class="small">The system can record movement and still miss responsibility.</text>

    <rect x="34" y="174" width="120" height="62" rx="2" class="node"/>
    <text x="60" y="212" class="mono">ACTION</text>
    <line x1="154" y1="205" x2="182" y2="205" class="line" marker-end="url(#arrow)"/>
    <rect x="184" y="174" width="120" height="62" rx="2" class="node"/>
    <text x="216" y="212" class="mono">TRACE</text>
    <line x1="304" y1="205" x2="332" y2="205" class="line" marker-end="url(#arrow)"/>
    <rect x="334" y="174" width="120" height="62" rx="2" class="node-blue"/>
    <text x="354" y="212" class="mono">RECEIPT</text>
    <line x1="454" y1="205" x2="482" y2="205" class="line" marker-end="url(#arrow)"/>
    <rect x="484" y="174" width="132" height="62" rx="2" class="node"/>
    <text x="519" y="212" class="mono">DONE?</text>

    <line x1="34" y1="276" x2="616" y2="276" class="line"/>
    <text x="34" y="316" class="small">Completion record ≠ accepted outcome</text>
  </g>

  <g transform="translate(866 326)">
    <rect width="650" height="360" rx="2" class="panel-hot"/>
    <text x="34" y="52" class="label-hot">ACCOUNTABLE LIFECYCLE</text>
    <text x="34" y="96" class="panel-title">A lifecycle must be accepted.</text>
    <text x="34" y="128" class="small">Intent, authority, evidence, and acceptance stay connected.</text>

    <rect x="34" y="174" width="166" height="62" rx="2" class="node-cyan"/>
    <text x="80" y="212" class="mono">INTENT</text>
    <line x1="200" y1="205" x2="224" y2="205" class="line-hot" marker-end="url(#arrow-hot)"/>
    <rect x="226" y="174" width="166" height="62" rx="2" class="node-blue"/>
    <text x="250" y="212" class="mono">AUTHORITY</text>
    <line x1="392" y1="205" x2="416" y2="205" class="line-hot" marker-end="url(#arrow-hot)"/>
    <rect x="418" y="174" width="166" height="62" rx="2" class="node"/>
    <text x="464" y="212" class="mono">ACTION</text>

    <rect x="34" y="266" width="166" height="62" rx="2" class="node-blue"/>
    <text x="76" y="304" class="mono">EVIDENCE</text>
    <line x1="200" y1="297" x2="224" y2="297" class="line-hot" marker-end="url(#arrow-hot)"/>
    <rect x="226" y="266" width="166" height="62" rx="2" class="node-cyan"/>
    <text x="242" y="304" class="mono">ACCEPTED</text>
    <line x1="392" y1="297" x2="416" y2="297" class="line-hot" marker-end="url(#arrow-hot)"/>
    <rect x="418" y="266" width="166" height="62" rx="2" class="node-blue"/>
    <text x="438" y="304" class="mono">REOPEN / FIX</text>

    <text x="34" y="350" class="small">A receipt is evidence, not authority.</text>
  </g>

  <text x="84" y="790" class="kicker">EXECUTION COMPLETION IS NOT DELIVERY.</text>
  <text x="548" y="790" class="footer">Jearon Wong / AI Agent Lifecycle / MPLP</text>
</svg>
