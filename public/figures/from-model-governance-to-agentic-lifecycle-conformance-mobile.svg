<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1840" viewBox="0 0 390 1840" role="img" aria-labelledby="title desc" data-visual-system="research-ledger-b" data-media-category="article-figure" data-palette="neutral-structure-functional-blue-semantic-exceptions" data-visual-revision="article-figure-b">
  <title id="title">From Model Governance to Agentic Lifecycle Conformance</title>
  <desc id="desc">A mobile-readable architecture diagram showing the path from regulatory baseline to RCCS-T, Missing Regulatory Objects, RCCS-M, ALCS, and mapped systems.</desc>
  <defs>
    <style>
      .bg { fill: #f7f8fa; }
      .grid-line { stroke: rgba(15,23,42,0.06); stroke-width: 1; }
      .frame { fill: none; stroke: rgba(15,23,42,0.18); stroke-width: 1.1; }
      .inner-frame { fill: none; stroke: rgba(100,116,139,0.28); stroke-width: 1; }
      .panel { fill: rgba(15,23,42,0.034); stroke: rgba(15,23,42,0.18); stroke-width: 1.2; }
      .panel-secondary { fill: rgba(100,116,139,0.075); stroke: rgba(100,116,139,0.46); stroke-width: 1.3; }
      .panel-emphasis { fill: rgba(100,116,139,0.075); stroke: rgba(100,116,139,0.48); stroke-width: 1.3; }
      .chip { fill: rgba(15,23,42,0.045); stroke: rgba(15,23,42,0.2); stroke-width: 1; }
      .chip-hot { fill: rgba(100,116,139,0.11); stroke: rgba(100,116,139,0.4); stroke-width: 1; }
      .kicker { fill: #5b6673; font-family: "JetBrains Mono", Menlo, monospace; font-size: 13px; font-weight: 800; letter-spacing: 0.9px; }
      .title { fill: #111827; font-family: "Outfit", Inter, sans-serif; font-size: 27px; font-weight: 850; letter-spacing: -0.2px; }
      .subtitle { fill: #334155; font-family: Inter, sans-serif; font-size: 17px; font-weight: 560; }
      .step { fill: #5b6673; font-family: "JetBrains Mono", Menlo, monospace; font-size: 13px; font-weight: 800; letter-spacing: 0.75px; }
      .heading { fill: #111827; font-family: "Outfit", Inter, sans-serif; font-size: 22px; font-weight: 830; letter-spacing: -0.1px; }
      .body { fill: #334155; font-family: Inter, sans-serif; font-size: 17px; font-weight: 560; }
      .body-muted { fill: #64748b; font-family: Inter, sans-serif; font-size: 16px; font-weight: 560; }
      .mono { fill: #1f2937; font-family: "JetBrains Mono", Menlo, monospace; font-size: 15px; font-weight: 800; letter-spacing: 0.2px; }
      .footer { fill: #64748b; font-family: "JetBrains Mono", Menlo, monospace; font-size: 13px; font-weight: 800; letter-spacing: 0.25px; }
      .arrow { stroke: rgba(100,116,139,0.84); stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .arrow-text { fill: #64748b; font-family: "JetBrains Mono", Menlo, monospace; font-size: 13px; font-weight: 800; letter-spacing: 0.3px; }
    </style>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" class="grid-line"/>
    </pattern>
    <marker id="arrow" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto">
      <path d="M0,0 L11,4.5 L0,9 Z" fill="#5b6673"/>
    </marker>
  </defs>

  <rect width="390" height="1840" class="bg"/>
  <rect width="390" height="1840" fill="url(#grid)"/>
  <rect x="16" y="16" width="358" height="1808" class="frame"/>
  <rect x="28" y="28" width="334" height="1784" class="inner-frame"/>

  <g transform="translate(40 66)">
    <text x="0" y="0" class="kicker">GAIC 2026</text>
    <text x="0" y="43" class="title">From Model</text>
    <text x="0" y="76" class="title">Governance to</text>
    <text x="0" y="109" class="title">Agentic Lifecycle</text>
    <text x="0" y="142" class="title">Conformance</text>
    <text x="0" y="181" class="subtitle">The compliance unit shifts</text>
    <text x="0" y="206" class="subtitle">when AI systems perform work.</text>
  </g>

  <g transform="translate(40 280)">
    <rect width="310" height="176" rx="2" class="panel"/>
    <text x="18" y="36" class="step">01 / REGULATORY BASELINE</text>
    <text x="18" y="73" class="heading">Existing governance</text>
    <text x="18" y="105" class="body-muted">EU AI Act · GDPR</text>
    <text x="18" y="130" class="body-muted">NIST AI RMF · ISO 42001</text>
    <text x="18" y="155" class="body-muted">Singapore MGF · W3C · Colorado</text>
  </g>

  <path d="M195 474 L195 524" class="arrow"/>
  <text x="214" y="507" class="arrow-text">IMPLIES</text>

  <g transform="translate(40 546)">
    <rect width="310" height="186" rx="2" class="panel-secondary"/>
    <text x="18" y="38" class="step">02 / RCCS-T</text>
    <text x="18" y="75" class="heading">Traditional coverage</text>
    <text x="18" y="110" class="body-muted">Risk management</text>
    <text x="18" y="135" class="body-muted">documentation · oversight</text>
    <text x="18" y="160" class="body-muted">security · monitoring</text>
  </g>

  <path d="M195 750 L195 800" class="arrow"/>
  <text x="214" y="782" class="arrow-text">AGENTIC GAP</text>

  <g transform="translate(40 824)">
    <rect width="310" height="432" rx="2" class="panel-emphasis"/>
    <text x="18" y="38" class="step">03 / MRO</text>
    <text x="18" y="75" class="heading">16 Missing</text>
    <text x="18" y="102" class="heading">Regulatory Objects</text>
    <text x="18" y="136" class="body-muted">Lifecycle objects make</text>
    <text x="18" y="161" class="body-muted">responsibility inspectable.</text>

    <rect x="18" y="190" width="274" height="54" rx="2" class="chip-hot"/>
    <text x="32" y="215" class="mono">Responsibility</text>
    <text x="32" y="237" class="body-muted">Objects 01 · 03 · 04 · 06</text>
    <rect x="18" y="258" width="274" height="54" rx="2" class="chip"/>
    <text x="32" y="283" class="mono">Authority</text>
    <text x="32" y="305" class="body-muted">Objects 02 · 05 · 07</text>
    <rect x="18" y="326" width="274" height="54" rx="2" class="chip"/>
    <text x="32" y="351" class="mono">Evidence</text>
    <text x="32" y="373" class="body-muted">Objects 08 · 11 · 12</text>
    <rect x="18" y="394" width="274" height="54" rx="2" class="chip-hot"/>
    <text x="32" y="419" class="mono">Privacy</text>
    <text x="32" y="441" class="body-muted">Objects 10 · 13 · 14</text>
  </g>

  <path d="M195 1274 L195 1324" class="arrow"/>
  <text x="214" y="1306" class="arrow-text">MRO-ADJUSTED</text>

  <g transform="translate(40 1348)">
    <rect width="310" height="124" rx="2" class="panel-secondary"/>
    <text x="18" y="38" class="step">04 / RCCS-M</text>
    <text x="18" y="75" class="heading">MRO-adjusted</text>
    <text x="18" y="104" class="body">coverage score</text>
  </g>

  <g transform="translate(40 1500)">
    <rect width="310" height="124" rx="2" class="panel-secondary"/>
    <text x="18" y="38" class="step">05 / ALCS</text>
    <text x="18" y="75" class="heading">Agentic lifecycle</text>
    <text x="18" y="104" class="body">conformance score</text>
  </g>

  <g transform="translate(40 1652)">
    <rect width="310" height="118" rx="2" class="panel"/>
    <text x="18" y="35" class="step">SYSTEMS MAPPED</text>
    <text x="18" y="66" class="body-muted">MPLP · IBM · Azure · AWS</text>
    <text x="18" y="90" class="body-muted">Google · LangGraph</text>
    <text x="18" y="114" class="body-muted">OpenAI · CrewAI</text>
  </g>

  <text x="40" y="1796" class="footer">AUTHOR-ANALYTICAL · NON-RANKING</text>
  <text x="40" y="1818" class="footer">NOT LEGAL ADVICE OR CERTIFICATION</text>
</svg>
