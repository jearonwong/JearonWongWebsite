<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" role="img" aria-labelledby="title desc" data-visual-system="research-ledger-b" data-media-category="article-figure" data-palette="neutral-structure-functional-blue-semantic-exceptions" data-visual-revision="article-figure-b">
  <title id="title">Lifecycle Walkthrough</title>
  <desc id="desc">Eight-stage lifecycle walkthrough for reconstructable agentic work: intent, delegation, planning, tool action, handoff, review, exception, and closure.</desc>
  <defs>
    <style>
      .bg{fill:#f7f8fa}.outer{fill:none;stroke:rgba(15,23,42,.16);stroke-width:1.2}.card{fill:rgba(15,23,42,.03);stroke:rgba(15,23,42,.16);stroke-width:1.2}.card-secondary{fill:rgba(100,116,139,.07);stroke:rgba(100,116,139,.46);stroke-width:1.5}.card-emphasis{fill:rgba(100,116,139,.065);stroke:rgba(100,116,139,.46);stroke-width:1.5}.num{fill:#5b6673;font:850 16px "JetBrains Mono",Menlo,monospace;letter-spacing:.55px}.head{fill:#111827;font:760 24px "Outfit",Inter,sans-serif}.body{fill:#64748b;font:520 17px Inter,sans-serif}.arrow{stroke:#5b6673;stroke-width:2.6;stroke-opacity:.75;fill:none;marker-end:url(#arrow)}.footer{fill:#64748b;font:800 15px "JetBrains Mono",Menlo,monospace;letter-spacing:.6px}
    </style>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0L0 0 0 40" fill="none" stroke="rgba(15,23,42,.05)" stroke-width="1"/>
    </pattern>
    <marker id="arrow" markerWidth="14" markerHeight="10" refX="13" refY="5" orient="auto"><path d="M0,0 L14,5 L0,10 Z" fill="#5b6673"/></marker>
  </defs>
  <rect width="1600" height="560" class="bg"/>
  <rect width="1600" height="560" fill="url(#grid)"/>
  <rect x="52" y="40" width="1496" height="480" class="outer"/>

  <g transform="translate(82 96)">
    <g transform="translate(0 0)"><rect width="300" height="106" rx="2" class="card-emphasis"/><text x="24" y="32" class="num">01</text><text x="78" y="32" class="head">Intent</text><text x="78" y="66" class="body">Who initiated?</text><text x="78" y="91" class="body">What was authorized?</text></g>
    <path d="M312 53H364" class="arrow"/>
    <g transform="translate(380 0)"><rect width="300" height="106" rx="2" class="card-emphasis"/><text x="24" y="32" class="num">02</text><text x="78" y="32" class="head">Delegation</text><text x="78" y="66" class="body">Scope defined?</text><text x="78" y="91" class="body">Boundary set?</text></g>
    <path d="M692 53H744" class="arrow"/>
    <g transform="translate(760 0)"><rect width="300" height="106" rx="2" class="card-secondary"/><text x="24" y="32" class="num">03</text><text x="78" y="32" class="head">Planning</text><text x="78" y="66" class="body">Steps recorded?</text><text x="78" y="91" class="body">Access scoped?</text></g>
    <path d="M1072 53H1124" class="arrow"/>
    <g transform="translate(1140 0)"><rect width="300" height="106" rx="2" class="card-secondary"/><text x="24" y="32" class="num">04</text><text x="78" y="32" class="head">Tool Action</text><text x="78" y="66" class="body">Evidence captured?</text><text x="78" y="91" class="body">Rollback documented?</text></g>
    <path d="M1290 106V208" class="arrow"/>
    <g transform="translate(1140 220)"><rect width="300" height="106" rx="2" class="card"/><text x="24" y="32" class="num">05</text><text x="78" y="32" class="head">Handoff</text><text x="78" y="66" class="body">Responsibility transferred?</text><text x="78" y="91" class="body">Context preserved?</text></g>
    <path d="M1124 273H1072" class="arrow"/>
    <g transform="translate(760 220)"><rect width="300" height="106" rx="2" class="card"/><text x="24" y="32" class="num">06</text><text x="78" y="32" class="head">Review</text><text x="78" y="66" class="body">Human role confirmed?</text><text x="78" y="91" class="body">Acceptance recorded?</text></g>
    <path d="M744 273H692" class="arrow"/>
    <g transform="translate(380 220)"><rect width="300" height="106" rx="2" class="card"/><text x="24" y="32" class="num">07</text><text x="78" y="32" class="head">Exception</text><text x="78" y="66" class="body">Deviation recorded?</text><text x="78" y="91" class="body">Escalation clear?</text></g>
    <path d="M364 273H312" class="arrow"/>
    <g transform="translate(0 220)"><rect width="300" height="106" rx="2" class="card-emphasis"/><text x="24" y="32" class="num">08</text><text x="78" y="32" class="head">Closure</text><text x="78" y="66" class="body">Remediation closed?</text><text x="78" y="91" class="body">Evidence archived?</text></g>
  </g>
  <text x="82" y="492" class="footer">COMPLETENESS TEST: AN AUDIT CHAIN IS INCOMPLETE UNTIL EXCEPTIONS ARE CLOSED</text>
</svg>
