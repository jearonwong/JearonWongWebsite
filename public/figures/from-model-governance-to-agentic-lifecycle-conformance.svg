<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc">
  <title id="title">From Model Governance to Agentic Lifecycle Conformance</title>
  <desc id="desc">A governed architecture diagram showing regulatory baseline, traditional compliance coverage, missing regulatory objects, RCCS-M, ALCS, and systems mapped in the Global AI Compliance White Paper 2026.</desc>
  <defs>
    <style>
      .bg { fill: #111111; }
      .grid-line { stroke: rgba(241,245,249,0.055); stroke-width: 1; }
      .frame { fill: none; stroke: rgba(241,245,249,0.14); stroke-width: 1.2; }
      .panel { fill: rgba(255,255,255,0.026); stroke: rgba(241,245,249,0.15); stroke-width: 1.4; }
      .panel-strong { fill: rgba(34,211,238,0.055); stroke: rgba(34,211,238,0.46); stroke-width: 1.6; }
      .panel-blue { fill: rgba(59,130,246,0.065); stroke: rgba(59,130,246,0.44); stroke-width: 1.6; }
      .panel-proof { fill: rgba(14,165,233,0.05); stroke: rgba(14,165,233,0.42); stroke-width: 1.6; }
      .kicker { fill: #22d3ee; font-family: "JetBrains Mono", Menlo, monospace; font-size: 18px; font-weight: 800; letter-spacing: 1.7px; }
      .title { fill: #f8fafc; font-family: "Outfit", Inter, sans-serif; font-size: 54px; font-weight: 850; letter-spacing: -0.5px; }
      .subtitle { fill: #94a3b8; font-family: Inter, sans-serif; font-size: 19px; font-weight: 500; }
      .step-label { fill: #22d3ee; font-family: "JetBrains Mono", Menlo, monospace; font-size: 14px; font-weight: 800; letter-spacing: 1.2px; }
      .step-title { fill: #f8fafc; font-family: "Outfit", Inter, sans-serif; font-size: 30px; font-weight: 800; letter-spacing: -0.2px; }
      .step-title-small { fill: #f8fafc; font-family: "Outfit", Inter, sans-serif; font-size: 25px; font-weight: 800; letter-spacing: -0.1px; }
      .body { fill: #cbd5e1; font-family: Inter, sans-serif; font-size: 16px; font-weight: 560; }
      .body-small { fill: #94a3b8; font-family: Inter, sans-serif; font-size: 14px; font-weight: 560; }
      .mono { fill: #e2e8f0; font-family: "JetBrains Mono", Menlo, monospace; font-size: 14px; font-weight: 800; letter-spacing: 0.4px; }
      .mono-muted { fill: #94a3b8; font-family: "JetBrains Mono", Menlo, monospace; font-size: 12px; font-weight: 800; letter-spacing: 0.55px; }
      .arrow { stroke: rgba(34,211,238,0.78); stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .arrow-muted { stroke: rgba(148,163,184,0.38); stroke-width: 2.2; fill: none; marker-end: url(#arrowMuted); }
      .divider { stroke: rgba(241,245,249,0.12); stroke-width: 1; }
      .chip { fill: rgba(255,255,255,0.04); stroke: rgba(241,245,249,0.16); stroke-width: 1; }
      .chip-hot { fill: rgba(34,211,238,0.09); stroke: rgba(34,211,238,0.38); stroke-width: 1; }
      .chip-blue { fill: rgba(59,130,246,0.09); stroke: rgba(59,130,246,0.34); stroke-width: 1; }
      .footer { fill: #64748b; font-family: "JetBrains Mono", Menlo, monospace; font-size: 13px; font-weight: 800; letter-spacing: 0.9px; }
    </style>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" class="grid-line"/>
    </pattern>
    <marker id="arrow" markerWidth="13" markerHeight="10" refX="12" refY="5" orient="auto">
      <path d="M0,0 L13,5 L0,10 Z" fill="#22d3ee"/>
    </marker>
    <marker id="arrowMuted" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto">
      <path d="M0,0 L12,4.5 L0,9 Z" fill="#94a3b8" opacity="0.68"/>
    </marker>
  </defs>

  <rect width="1600" height="1200" class="bg"/>
  <rect width="1600" height="1200" fill="url(#grid)"/>
  <rect x="52" y="50" width="1496" height="1100" class="frame"/>
  <rect x="76" y="74" width="1448" height="1052" fill="none" stroke="rgba(34,211,238,0.28)" stroke-width="1"/>

  <g transform="translate(104 118)">
    <text x="0" y="0" class="kicker">GLOBAL AI COMPLIANCE WHITE PAPER 2026 / GOVERNANCE ARGUMENT</text>
    <text x="0" y="64" class="title">From Model Governance to Agentic Lifecycle Conformance</text>
    <text x="0" y="104" class="subtitle">The compliance unit shifts when AI systems stop only producing outputs and start performing work.</text>
  </g>

  <g transform="translate(130 270)">
    <rect width="1340" height="132" rx="2" class="panel"/>
    <text x="28" y="38" class="step-label">01 / REGULATORY BASELINE</text>
    <text x="28" y="82" class="step-title">Existing governance language</text>
    <text x="492" y="44" class="body">EU AI Act · GDPR · NIST AI RMF · ISO/IEC 42001</text>
    <text x="492" y="82" class="body">Singapore MGF · W3C PROV · Verifiable Credentials · Colorado AI Act</text>
    <text x="1044" y="54" class="mono-muted">MODEL GOVERNANCE</text>
    <text x="1044" y="82" class="mono-muted">RISK / RECORDS / OVERSIGHT</text>
  </g>

  <path d="M800 414 L800 470" class="arrow"/>
  <text x="835" y="448" class="mono-muted">IMPLIES</text>

  <g transform="translate(130 486)">
    <rect width="1340" height="136" rx="2" class="panel-blue"/>
    <text x="28" y="38" class="step-label">02 / RCCS-T</text>
    <text x="28" y="82" class="step-title">Traditional Compliance Coverage</text>
    <g transform="translate(510 28)">
      <rect x="0" y="0" width="128" height="34" rx="2" class="chip-blue"/>
      <text x="18" y="23" class="mono-muted">Risk mgmt</text>
      <rect x="146" y="0" width="158" height="34" rx="2" class="chip-blue"/>
      <text x="164" y="23" class="mono-muted">Documentation</text>
      <rect x="322" y="0" width="126" height="34" rx="2" class="chip-blue"/>
      <text x="340" y="23" class="mono-muted">Oversight</text>
      <rect x="466" y="0" width="104" height="34" rx="2" class="chip-blue"/>
      <text x="484" y="23" class="mono-muted">Security</text>
      <rect x="588" y="0" width="150" height="34" rx="2" class="chip-blue"/>
      <text x="606" y="23" class="mono-muted">Accountability</text>
      <rect x="756" y="0" width="126" height="34" rx="2" class="chip-blue"/>
      <text x="774" y="23" class="mono-muted">Monitoring</text>
      <text x="0" y="78" class="body-small">Necessary for regulatory contact. Insufficient once agents perform work across tools, roles, projects, vendors, and runtime boundaries.</text>
    </g>
  </g>

  <path d="M800 635 L800 692" class="arrow"/>
  <text x="835" y="667" class="mono-muted">INSUFFICIENT FOR AGENTS</text>

  <g transform="translate(130 708)">
    <rect width="1340" height="214" rx="2" class="panel-strong"/>
    <text x="28" y="40" class="step-label">03 / MRO</text>
    <text x="28" y="86" class="step-title">16 Missing Regulatory Objects</text>
    <text x="28" y="124" class="body-small">The object layer where regulatory language becomes inspectable inside agent execution.</text>
    <g transform="translate(470 28)">
      <rect x="0" y="0" width="254" height="68" rx="2" class="chip-hot"/>
      <text x="18" y="25" class="mono">Responsibility</text>
      <text x="18" y="50" class="body-small">01 · 03 · 04 · 06</text>
      <rect x="280" y="0" width="216" height="68" rx="2" class="chip"/>
      <text x="298" y="25" class="mono">Authority</text>
      <text x="298" y="50" class="body-small">02 · 05 · 07</text>
      <rect x="522" y="0" width="216" height="68" rx="2" class="chip-hot"/>
      <text x="540" y="25" class="mono">Evidence</text>
      <text x="540" y="50" class="body-small">08 · 11 · 12</text>
      <rect x="764" y="0" width="216" height="68" rx="2" class="chip"/>
      <text x="782" y="25" class="mono">Privacy</text>
      <text x="782" y="50" class="body-small">10 · 13 · 14</text>

      <rect x="0" y="90" width="254" height="68" rx="2" class="chip"/>
      <text x="18" y="115" class="mono">Substitution</text>
      <text x="18" y="140" class="body-small">09 · 15</text>
      <rect x="280" y="90" width="216" height="68" rx="2" class="chip-hot"/>
      <text x="298" y="115" class="mono">Closure</text>
      <text x="298" y="140" class="body-small">16</text>
      <rect x="522" y="90" width="458" height="68" rx="2" class="chip-blue"/>
      <text x="540" y="115" class="mono">Lifecycle responsibility compliance</text>
      <text x="540" y="140" class="body-small">authorization · evidence · acceptance · remediation · rollback</text>
    </g>
  </g>

  <path d="M800 935 L800 985" class="arrow"/>
  <text x="835" y="964" class="mono-muted">MRO-ADJUSTED</text>

  <g transform="translate(130 1000)">
    <rect width="640" height="96" rx="2" class="panel-proof"/>
    <text x="28" y="38" class="step-label">04 / RCCS-M</text>
    <text x="28" y="76" class="step-title-small">MRO-adjusted coverage score</text>
  </g>
  <g transform="translate(830 1000)">
    <rect width="640" height="96" rx="2" class="panel-proof"/>
    <text x="28" y="38" class="step-label">05 / ALCS</text>
    <text x="28" y="76" class="step-title-small">Agentic lifecycle conformance score</text>
  </g>

  <path d="M800 1108 L800 1136" class="arrow-muted"/>
  <text x="130" y="1144" class="footer">SYSTEMS MAPPED: MPLP · IBM WATSONX · AZURE AI FOUNDRY · AWS BEDROCK · GOOGLE VERTEX · LANGGRAPH · OPENAI SDK · CREWAI</text>
  <text x="130" y="1174" class="footer">AUTHOR-ANALYTICAL · SOURCE-QUALIFIED · NON-RANKING · NOT LEGAL ADVICE OR CERTIFICATION</text>
</svg>
