<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1720" viewBox="0 0 1000 1720" role="img" aria-labelledby="title desc" data-visual-system="research-ledger-b" data-media-category="article-figure" data-palette="neutral-structure-functional-blue-semantic-exceptions" data-visual-revision="article-figure-b">
  <title id="title">From Model Governance to Agentic Lifecycle Conformance</title>
  <desc id="desc">A readable architecture diagram showing how the white paper moves from regulatory baseline to traditional compliance coverage, Missing Regulatory Objects, RCCS-M, ALCS, and mapped systems.</desc>
  <defs>
    <style>
      .bg { fill: #f7f8fa; }
      .grid-line { stroke: rgba(15,23,42,0.055); stroke-width: 1; }
      .frame { fill: none; stroke: rgba(15,23,42,0.18); stroke-width: 1.3; }
      .inner-frame { fill: none; stroke: rgba(100,116,139,0.3); stroke-width: 1; }
      .panel { fill: rgba(15,23,42,0.032); stroke: rgba(15,23,42,0.18); stroke-width: 1.5; }
      .panel-secondary { fill: rgba(100,116,139,0.075); stroke: rgba(100,116,139,0.48); stroke-width: 1.6; }
      .panel-emphasis { fill: rgba(100,116,139,0.07); stroke: rgba(100,116,139,0.5); stroke-width: 1.7; }
      .chip { fill: rgba(15,23,42,0.045); stroke: rgba(15,23,42,0.2); stroke-width: 1.1; }
      .chip-hot { fill: rgba(100,116,139,0.11); stroke: rgba(100,116,139,0.42); stroke-width: 1.1; }
      .kicker { fill: #5b6673; font-family: "JetBrains Mono", Menlo, monospace; font-size: 18px; font-weight: 800; letter-spacing: 1.4px; }
      .title { fill: #111827; font-family: "Outfit", Inter, sans-serif; font-size: 46px; font-weight: 850; letter-spacing: -0.35px; }
      .subtitle { fill: #334155; font-family: Inter, sans-serif; font-size: 23px; font-weight: 560; }
      .step { fill: #5b6673; font-family: "JetBrains Mono", Menlo, monospace; font-size: 18px; font-weight: 800; letter-spacing: 1.1px; }
      .heading { fill: #111827; font-family: "Outfit", Inter, sans-serif; font-size: 34px; font-weight: 830; letter-spacing: -0.15px; }
      .body { fill: #334155; font-family: Inter, sans-serif; font-size: 23px; font-weight: 560; }
      .body-muted { fill: #64748b; font-family: Inter, sans-serif; font-size: 21px; font-weight: 560; }
      .body-small { fill: #64748b; font-family: Inter, sans-serif; font-size: 20px; font-weight: 560; }
      .mono { fill: #1f2937; font-family: "JetBrains Mono", Menlo, monospace; font-size: 20px; font-weight: 800; letter-spacing: 0.35px; }
      .mono-small { fill: #64748b; font-family: "JetBrains Mono", Menlo, monospace; font-size: 17px; font-weight: 800; letter-spacing: 0.55px; }
      .footer { fill: #64748b; font-family: "JetBrains Mono", Menlo, monospace; font-size: 17px; font-weight: 800; letter-spacing: 0.55px; }
      .arrow { stroke: rgba(100,116,139,0.84); stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .arrow-text { fill: #64748b; font-family: "JetBrains Mono", Menlo, monospace; font-size: 18px; font-weight: 800; letter-spacing: 0.55px; }
    </style>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" class="grid-line"/>
    </pattern>
    <marker id="arrow" markerWidth="15" markerHeight="12" refX="14" refY="6" orient="auto">
      <path d="M0,0 L15,6 L0,12 Z" fill="#5b6673"/>
    </marker>
  </defs>

  <rect width="1000" height="1720" class="bg"/>
  <rect width="1000" height="1720" fill="url(#grid)"/>
  <rect x="40" y="40" width="920" height="1640" class="frame"/>
  <rect x="62" y="62" width="876" height="1596" class="inner-frame"/>

  <g transform="translate(90 98)">
    <text x="0" y="0" class="kicker">GAIC 2026 / GOVERNANCE ARGUMENT</text>
    <text x="0" y="62" class="title">From Model Governance</text>
    <text x="0" y="114" class="title">to Agentic Lifecycle Conformance</text>
    <text x="0" y="164" class="subtitle">The compliance unit shifts when AI systems perform work.</text>
  </g>

  <g transform="translate(90 276)">
    <rect width="820" height="170" rx="2" class="panel"/>
    <text x="30" y="42" class="step">01 / REGULATORY BASELINE</text>
    <text x="30" y="88" class="heading">Existing governance language</text>
    <text x="30" y="128" class="body-muted">EU AI Act · GDPR · NIST AI RMF · ISO/IEC 42001</text>
    <text x="30" y="158" class="body-muted">Singapore MGF · W3C provenance · Colorado AI Act</text>
  </g>

  <path d="M500 462 L500 510" class="arrow"/>
  <text x="532" y="494" class="arrow-text">IMPLIES</text>

  <g transform="translate(90 530)">
    <rect width="820" height="174" rx="2" class="panel-secondary"/>
    <text x="30" y="44" class="step">02 / RCCS-T</text>
    <text x="30" y="90" class="heading">Traditional Compliance Coverage</text>
    <text x="30" y="132" class="body-muted">Risk management · documentation · oversight</text>
    <text x="30" y="162" class="body-muted">security · accountability · monitoring</text>
  </g>

  <path d="M500 720 L500 770" class="arrow"/>
  <text x="532" y="752" class="arrow-text">AGENTIC GAP</text>

  <g transform="translate(90 792)">
    <rect width="820" height="324" rx="2" class="panel-emphasis"/>
    <text x="30" y="44" class="step">03 / MRO</text>
    <text x="30" y="90" class="heading">16 Missing Regulatory Objects</text>
    <text x="30" y="130" class="body-muted">Lifecycle objects make responsibility inspectable.</text>

    <rect x="30" y="160" width="360" height="62" rx="2" class="chip-hot"/>
    <text x="50" y="188" class="mono">Responsibility</text>
    <text x="50" y="212" class="body-small">Objects 01 · 03 · 04 · 06</text>
    <rect x="430" y="160" width="360" height="62" rx="2" class="chip"/>
    <text x="450" y="188" class="mono">Authority</text>
    <text x="450" y="212" class="body-small">Objects 02 · 05 · 07</text>

    <rect x="30" y="238" width="360" height="62" rx="2" class="chip"/>
    <text x="50" y="266" class="mono">Evidence</text>
    <text x="50" y="290" class="body-small">Objects 08 · 11 · 12</text>
    <rect x="430" y="238" width="360" height="62" rx="2" class="chip-hot"/>
    <text x="450" y="266" class="mono">Privacy</text>
    <text x="450" y="290" class="body-small">Objects 10 · 13 · 14</text>
  </g>

  <path d="M500 1134 L500 1184" class="arrow"/>
  <text x="532" y="1166" class="arrow-text">MRO-ADJUSTED EVALUATION</text>

  <g transform="translate(90 1206)">
    <rect width="390" height="168" rx="2" class="panel-secondary"/>
    <text x="28" y="44" class="step">04 / RCCS-M</text>
    <text x="28" y="90" class="heading">MRO-adjusted</text>
    <text x="28" y="128" class="body">coverage score</text>
  </g>

  <g transform="translate(520 1206)">
    <rect width="390" height="168" rx="2" class="panel-secondary"/>
    <text x="28" y="44" class="step">05 / ALCS</text>
    <text x="28" y="90" class="heading">Agentic lifecycle</text>
    <text x="28" y="128" class="body">conformance score</text>
  </g>

  <path d="M500 1392 L500 1430" class="arrow"/>
  <text x="532" y="1420" class="arrow-text">MAPPED AGAINST SYSTEMS</text>

  <g transform="translate(90 1450)">
    <rect width="820" height="118" rx="2" class="panel"/>
    <text x="30" y="42" class="step">SYSTEMS MAPPED</text>
    <text x="30" y="76" class="body-small">MPLP · IBM watsonx · Azure AI Foundry · AWS Bedrock</text>
    <text x="30" y="104" class="body-small">Google Vertex · LangGraph · OpenAI SDK · CrewAI</text>
  </g>

  <text x="90" y="1592" class="footer">AUTHOR-ANALYTICAL · SOURCE-QUALIFIED · NON-RANKING</text>
  <text x="90" y="1616" class="footer">NOT LEGAL ADVICE OR CERTIFICATION</text>
</svg>
