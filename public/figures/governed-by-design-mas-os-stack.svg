<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940" role="img" aria-labelledby="title desc">
  <title id="title">Governed by Design MAS OS Stack</title>
  <desc id="desc">A registry-style stack diagram showing Foundation Models feeding the MPLP protocol layer, Cognitive OS object runtime, application surfaces, and evidence and accountability outputs.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0L0 0 0 40" fill="none" stroke="#f1f5f9" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
    <marker id="arrow" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto">
      <path d="M0,0 L12,5 L0,10 Z" fill="#22d3ee"/>
    </marker>
    <style>
      .bg{fill:#111111}
      .frame{fill:none;stroke:#f1f5f9;stroke-opacity:.14;stroke-width:1.2}
      .frame-blue{fill:none;stroke:#3b82f6;stroke-opacity:.34;stroke-width:1.1}
      .label{fill:#22d3ee;font-family:"JetBrains Mono",Menlo,monospace;font-size:18px;font-weight:800;letter-spacing:1.4px}
      .label-muted{fill:#94a3b8;font-family:"JetBrains Mono",Menlo,monospace;font-size:14px;font-weight:800;letter-spacing:1px}
      .title{fill:#f8fafc;font-family:"Outfit",Inter,sans-serif;font-size:46px;font-weight:760;letter-spacing:0}
      .copy{fill:#cbd5e1;font-family:Inter,sans-serif;font-size:19px;font-weight:560}
      .small{fill:#94a3b8;font-family:Inter,sans-serif;font-size:16px;font-weight:520}
      .mono{fill:#e2e8f0;font-family:"JetBrains Mono",Menlo,monospace;font-size:16px;font-weight:800;letter-spacing:.35px}
      .box{fill:rgba(255,255,255,.035);stroke:rgba(241,245,249,.14);stroke-width:1.2}
      .box-protocol{fill:rgba(34,211,238,.075);stroke:rgba(34,211,238,.48);stroke-width:1.7}
      .box-runtime{fill:rgba(59,130,246,.075);stroke:rgba(59,130,246,.42);stroke-width:1.5}
      .box-application{fill:rgba(59,130,246,.05);stroke:rgba(59,130,246,.3);stroke-width:1.4}
      .box-proof{fill:rgba(34,211,238,.095);stroke:rgba(34,211,238,.52);stroke-width:1.4}
      .line{stroke:#22d3ee;stroke-opacity:.74;stroke-width:2.4;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect width="1600" height="940" class="bg"/>
  <rect width="1600" height="940" fill="url(#grid)"/>
  <rect x="52" y="52" width="1496" height="836" class="frame"/>
  <rect x="82" y="82" width="1436" height="776" class="frame-blue"/>

  <text x="112" y="136" class="label">GOVERNED BY DESIGN / MPLP + COGNITIVE OS</text>
  <text x="112" y="205" class="title">Protocol-Native Multi-Agent Operating Stack</text>
  <text x="112" y="247" class="copy">Intent versioning, Drift Detection, HITL Confirmation Boundaries, Evidence chains, Agent Handoff, and Accepted Outcome semantics live at the protocol layer.</text>

  <g transform="translate(180 294)">
    <rect x="300" y="0" width="640" height="58" rx="4" class="box"/>
    <text x="620" y="26" text-anchor="middle" class="mono">FOUNDATION MODELS / LLM</text>
    <text x="620" y="48" text-anchor="middle" class="small">generate intelligence</text>
    <line x1="620" y1="58" x2="620" y2="82" class="line"/>

    <rect x="112" y="92" width="1016" height="134" rx="6" class="box-protocol"/>
    <text x="142" y="126" class="label">MPLP PROTOCOL LAYER / VENDOR-NEUTRAL LIFECYCLE SEMANTICS</text>
    <g transform="translate(142 146)">
      <rect width="150" height="58" rx="3" class="box"/>
      <text x="75" y="25" text-anchor="middle" class="mono">Intent</text>
      <text x="75" y="45" text-anchor="middle" class="small">versioned scope</text>
    </g>
    <g transform="translate(310 146)">
      <rect width="164" height="58" rx="3" class="box"/>
      <text x="82" y="25" text-anchor="middle" class="mono">Drift</text>
      <text x="82" y="45" text-anchor="middle" class="small">runtime condition</text>
    </g>
    <g transform="translate(492 146)">
      <rect width="202" height="58" rx="3" class="box"/>
      <text x="101" y="25" text-anchor="middle" class="mono">Confirm</text>
      <text x="101" y="45" text-anchor="middle" class="small">HITL boundary</text>
    </g>
    <g transform="translate(712 146)">
      <rect width="184" height="58" rx="3" class="box"/>
      <text x="92" y="25" text-anchor="middle" class="mono">Evidence</text>
      <text x="92" y="45" text-anchor="middle" class="small">portable chain</text>
    </g>
    <g transform="translate(914 146)">
      <rect width="184" height="58" rx="3" class="box"/>
      <text x="92" y="25" text-anchor="middle" class="mono">Outcome</text>
      <text x="92" y="45" text-anchor="middle" class="small">accepted state</text>
    </g>

    <line x1="620" y1="226" x2="620" y2="256" class="line"/>
    <rect x="112" y="266" width="1016" height="94" rx="6" class="box-runtime"/>
    <text x="142" y="300" class="label-muted">COGNITIVE OS / OBJECT RUNTIME IMPLEMENTING MPLP SEMANTICS</text>
    <g transform="translate(142 316)">
      <rect width="280" height="34" rx="3" class="box"/>
      <text x="140" y="23" text-anchor="middle" class="mono">Agent Objects</text>
    </g>
    <g transform="translate(480 316)">
      <rect width="280" height="34" rx="3" class="box"/>
      <text x="140" y="23" text-anchor="middle" class="mono">Enterprise Objects</text>
    </g>
    <g transform="translate(818 316)">
      <rect width="280" height="34" rx="3" class="box"/>
      <text x="140" y="23" text-anchor="middle" class="mono">Trust Objects</text>
    </g>

    <line x1="620" y1="360" x2="620" y2="390" class="line"/>
    <g transform="translate(190 400)">
      <rect width="250" height="54" rx="5" class="box-application"/>
      <text x="125" y="34" text-anchor="middle" class="mono">SoloCrew</text>
    </g>
    <g transform="translate(495 400)">
      <rect width="250" height="54" rx="5" class="box-application"/>
      <text x="125" y="34" text-anchor="middle" class="mono">Tacit</text>
    </g>
    <g transform="translate(800 400)">
      <rect width="250" height="54" rx="5" class="box-application"/>
      <text x="125" y="34" text-anchor="middle" class="mono">Enterprise Apps</text>
    </g>

    <line x1="620" y1="454" x2="620" y2="484" class="line"/>
    <rect x="252" y="494" width="736" height="64" rx="5" class="box-proof"/>
    <text x="620" y="521" text-anchor="middle" class="mono">Audit / Replay / Accountability / Insurability Proof Surface</text>
    <text x="620" y="545" text-anchor="middle" class="small">produced during execution, not reconstructed afterward</text>
  </g>

  <text x="112" y="858" class="label-muted">BOUNDARY: ARCHITECTURAL MAP, NOT CERTIFICATION, REGULATOR APPROVAL, OR ADOPTION CLAIM</text>
</svg>
