    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#6b7785"/>
    </marker>
  </defs>
  <rect width="1200" height="760" fill="#f7f8fa"/>
