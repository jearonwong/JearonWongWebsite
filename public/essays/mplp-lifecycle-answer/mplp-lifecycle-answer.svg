      <text x="18" y="58" fill="#111827" font-family="Outfit, Inter, sans-serif" font-size="22" font-weight="800">Confirm</text>
      <text x="18" y="80" fill="#334155" font-family="Inter, sans-serif" font-size="14" font-weight="560">Human revalidation</text>
