  <text x="92" y="116" fill="#5b6673" font-family="JetBrains Mono, Menlo, monospace" font-size="15" font-weight="800" letter-spacing="1.1">FIGURE 1 / LIFECYCLE GOVERNANCE CHAIN</text>
  <text x="92" y="174" fill="#111827" font-family="Outfit, Inter, sans-serif" font-size="48" font-weight="850">The MPLP Lifecycle Answer</text>
  <text x="92" y="212" fill="#334155" font-family="Inter, sans-serif" font-size="20" font-weight="600">A governed path from human intent to accepted outcome and closure.</text>

